<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cartel</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500&display=swap" rel="stylesheet">
<style>
:root{--s:1;--w:600px}
html,body{margin:0;background:transparent;overflow:hidden;font-family:'Rubik',system-ui,sans-serif}
#pill{display:inline-block;margin:16px;padding:12px 30px;border-radius:16px;background:rgba(13,15,28,.82);border:2px solid #dc2743;animation:bord 10s linear infinite;transform:scale(var(--s));transform-origin:top left}
@keyframes bord{0%,100%{border-color:#dc2743}25%{border-color:#25f4ee}50%{border-color:#8b5cf6}75%{border-color:#ffa63d}}
.txt{position:relative;display:inline-block;font-size:34px;font-weight:500;color:#fff;white-space:nowrap}

/* degradado: color que se desplaza + destello */
.degradado .txt{background:linear-gradient(90deg,#ff4d8d,#ffa63d,#25f4ee,#8b5cf6,#ff4d8d);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
@keyframes flow{to{background-position:300% 0}}

/* destello (en degradado y brillo) */
.degradado .txt::after,.brillo .txt::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;height:100%;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%);background-size:250% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s ease-in-out infinite}
@keyframes shine{0%,55%{background-position:100% 0}100%{background-position:0 0}}

/* onda: letras que suben y bajan */
.onda .ch{display:inline-block;color:#fff;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:translateY(0);color:#fff}30%{transform:translateY(-9px);color:#ffd23f}}

/* marquesina: el texto pasa de derecha a izquierda */
.marquesina #pill{width:var(--w);overflow:hidden;box-sizing:border-box}
.marquesina .txt{padding-left:100%;animation:slide 10s linear infinite}
@keyframes slide{to{transform:translateX(-100%)}}

@media (prefers-reduced-motion:reduce){#pill,.txt,.txt::after,.ch{animation:none!important}}
</style>
</head>
<body>
<div id="pill"><span id="txt" class="txt"></span></div>
<script>
/*
  Uso en OBS (fuente de navegador), ejemplo:
  https://TU_USUARIO.github.io/REPO/capitulo-extra.html?texto=Capítulo extra: 400 bits o 2 subs&anim=degradado

  - texto: el mensaje que se muestra (no uses el simbolo & dentro del texto).
  - anim: degradado (por defecto), brillo, onda o marquesina.
  - size: tamano (1 = normal, 1.5 = mas grande).
  - ancho: solo para marquesina, ancho del cartel en pixeles (por defecto 600).
*/
const q = new URLSearchParams(location.search);
const texto = q.has('texto') ? q.get('texto') : 'Capítulo extra: 400 bits o 2 subs';
const anim = ['degradado', 'brillo', 'onda', 'marquesina'].includes(q.get('anim')) ? q.get('anim') : 'degradado';
const root = document.documentElement;
root.style.setProperty('--s', parseFloat(q.get('size')) || 1);
root.style.setProperty('--w', (parseInt(q.get('ancho'), 10) || 600) + 'px');
document.body.className = anim;

const t = document.getElementById('txt');
t.dataset.t = texto;
if (anim === 'onda') {
  [...texto].forEach((c, i) => {
    const s = document.createElement('span');
    s.className = 'ch';
    s.textContent = c === ' ' ? '\u00a0' : c;
    s.style.animationDelay = (i * 0.07) + 's';
    t.appendChild(s);
  });
} else {
  t.textContent = texto;
}
if (!texto.trim()) document.getElementById('pill').style.display = 'none';
</script>
</body>
</html>
